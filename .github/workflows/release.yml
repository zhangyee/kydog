name: Release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # requireSymlink：把「必须能建符号链接」钉在至少一个平台上。
          # 那批用例考的是软链能不能越出目录、写入会不会穿透链接 —— 平台无关的逻辑。
          # 没有这道闸，「本机建不了就跳过」的机制会一路跳到 CI，安全覆盖在发版流水线上
          # 静默消失，而绿灯照常亮。
          # 三个 runner 的软链能力都已由 Report 步骤实测确认（2026-09-01 run 33513291710
          # 三平台探针均打出 OK），全部钉死。探针步骤保留：能力哪天退化，日志里看得见。
          - { os: macos-15,       target: darwin-arm64, requireSymlink: '1' }
          - { os: macos-15-intel, target: darwin-x64,   requireSymlink: '1' }
          - { os: windows-latest, target: win32-x64,    requireSymlink: '1' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致；装出来的应用会自报错误版本，更新判定会失效"
            exit 1
          fi
      - run: npm ci          # postinstall fetches host-platform fastpaper
      # Windows 上建符号链接要 SeCreateSymbolicLinkPrivilege，普通用户默认没有。
      # 「开发者模式」是把这项特权给到普通用户的一次性开关。runner 上尽力而为：
      # 开不成也不挡流水线，能力如何由下一步如实打印。
      - name: Enable Windows developer mode (for symlink tests)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      # 把「这台机器能不能建软链」打进日志：跳过多少条必须看得见，不能是静默的。
      - name: Report symlink capability
        shell: bash
        run: |
          node -e "
            const fs=require('node:fs'), os=require('node:os'), p=require('node:path');
            const d=fs.mkdtempSync(p.join(os.tmpdir(),'kydog-symcap-'));
            fs.writeFileSync(p.join(d,'t.txt'),'x');
            try { fs.symlinkSync(p.join(d,'t.txt'), p.join(d,'l.txt')); console.log('symlink capability: OK'); }
            catch (e) { console.log('symlink capability: UNAVAILABLE ->', e.code); }
            finally { fs.rmSync(d,{recursive:true,force:true}); }
          "
      - run: npm run lint
      - run: npm test
        env:
          # 空字符串 = 不强制（见上面 matrix 里的说明）。非空时软链用例不再跳过，
          # 建不出来就让它以 EPERM 红出来。
          KYDOG_REQUIRE_SYMLINK: ${{ matrix.requireSymlink }}
      - run: npm run make
      # e2e 复用 make 刚产出的 .vite/build 与 out/ 打包成品（含 54 冒烟），不重复打包。
      - run: npx playwright install chromium
      - run: npm run e2e
      # always 而非 failure：flaky（retry 转绿）时 job 是成功态，failure() 不执行，
      # 而失败尝试的 trace 就留在 test-results 里（实证见 spec 事实基础）——不上传就随
      # runner 销毁。全绿时这里只有一个 .last-run.json，成本可忽略。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-${{ matrix.target }}
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: kydog-${{ matrix.target }}
          path: out/make/**/*
          if-no-files-found: error

  release:
    needs: build
    # workflow_dispatch 可以选 tag 作运行 ref，只看 ref 会让演练误发版。
    # 协议语义：dispatch 只演练，tag push 才发版。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # e2e 现场 artifact 不是发版资产，不许进 dist（trace.zip / error-context.md
          # 一旦混进 SHA256SUMS.txt 就会被当成公开发布件上传）。
          pattern: kydog-*
          merge-multiple: true
      - name: Compute SHA256SUMS.txt
        run: |
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -exec shasum -a 256 {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          draft: true
          generate_release_notes: true
          # tag 含 '-' 即 semver prerelease；更新服务会跳过 prerelease，
          # 标对了才不会被 latest 选中。
          prerelease: ${{ contains(github.ref_name, '-') }}
